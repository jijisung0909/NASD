<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>와슈 커뮤니티</title>
<meta name="description" content="와슈 커뮤니티 - 자유롭게 이야기를 나누는 커뮤니티">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #202124;
    --sub: #777;
    --line: #e5e7eb;
    --point: #4f46e5;
    --point-light: #eef2ff;
}

body.dark {
    --bg: #111318;
    --card: #1b1e25;
    --text: #f1f3f5;
    --sub: #a5a8b0;
    --line: #30343d;
    --point-light: #252a4a;
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--card);
    border-bottom: 1px solid var(--line);
}

.header-inner {
    max-width: 1400px;
    min-height: 64px;
    margin: auto;
    padding: 10px 20px;

    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    color: var(--point);
    text-decoration: none;
    font-size: 26px;
    font-weight: 900;
    white-space: nowrap;
}

.search {
    flex: 1;
    max-width: 600px;
    margin: auto;

    display: flex;
}

.search input {
    width: 100%;
    height: 42px;

    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 8px 0 0 8px;

    padding: 0 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
}

.search button {
    width: 48px;
    border: 0;
    border-radius: 0 8px 8px 0;

    background: var(--point);
    color: white;
    cursor: pointer;
}

.header-buttons {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
}

.header-buttons button {
    min-width: 42px;
    height: 40px;

    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);

    padding: 0 12px;
    border-radius: 7px;
    cursor: pointer;
}

.header-buttons button:hover {
    background: var(--point-light);
}

/* =========================
   MAIN
========================= */

.container {
    max-width: 1400px;
    margin: 25px auto;
    padding: 0 20px;

    display: grid;
    grid-template-columns: 220px minmax(0, 1fr) 250px;
    gap: 20px;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
    height: fit-content;
}

.sidebar-title {
    padding: 17px;
    font-weight: 800;
    border-bottom: 1px solid var(--line);
}

.gallery {
    padding: 8px;
}

.gallery button {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);

    padding: 12px;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
}

.gallery button:hover,
.gallery button.active {
    background: var(--point-light);
    color: var(--point);
    font-weight: 700;
}

/* =========================
   CENTER
========================= */

.page-title {
    margin-bottom: 15px;
}

.page-title h1 {
    margin: 0;
    font-size: 24px;
}

.page-title p {
    color: var(--sub);
    margin: 6px 0 0;
    font-size: 14px;
}

.card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
}

.tabs button {
    flex: 1;
    padding: 14px;
    border: 0;
    background: transparent;
    color: var(--sub);
    cursor: pointer;
}

.tabs button.active {
    color: var(--point);
    font-weight: 800;
    border-bottom: 2px solid var(--point);
}

/* =========================
   POST LIST
========================= */

.post {
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
}

.post:hover {
    background: var(--bg);
}

.post-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 8px;
}

.post-title .comment-count {
    color: var(--point);
    font-size: 13px;
    margin-left: 5px;
}

.post-content-preview {
    color: var(--sub);
    font-size: 13px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.post-info {
    display: flex;
    gap: 12px;
    margin-top: 10px;

    color: var(--sub);
    font-size: 12px;
}

.category {
    color: var(--point);
    font-weight: 700;
}

.empty {
    padding: 60px 20px;
    text-align: center;
    color: var(--sub);
}

/* =========================
   WRITE
========================= */

.write-area {
    padding: 14px;
}

.write-btn {
    width: 100%;
    height: 45px;

    border: 0;
    border-radius: 8px;

    background: var(--point);
    color: white;
    font-size: 15px;
    font-weight: 700;

    cursor: pointer;
}

.form {
    display: none;
    padding: 18px;
    border-top: 1px solid var(--line);
}

.form.show {
    display: block;
}

.form input,
.form select,
.form textarea {
    width: 100%;
    margin-bottom: 10px;

    border: 1px solid var(--line);
    border-radius: 7px;

    background: var(--bg);
    color: var(--text);

    padding: 11px;
    outline: none;
}

.form textarea {
    min-height: 180px;
    resize: vertical;
}

.form-buttons {
    display: flex;
    gap: 8px;
}

.form-buttons button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}

.cancel {
    background: var(--bg);
    color: var(--text);
}

.submit {
    background: var(--point);
    color: white;
}

/* =========================
   RIGHT
========================= */

.right-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    margin-bottom: 15px;
    overflow: hidden;
}

.right-title {
    padding: 15px;
    font-weight: 800;
    border-bottom: 1px solid var(--line);
}

.popular {
    padding: 12px 15px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
}

.popular:last-child {
    border-bottom: 0;
}

.popular-title {
    font-size: 14px;
    font-weight: 700;
}

.popular-info {
    color: var(--sub);
    font-size: 11px;
    margin-top: 5px;
}

/* =========================
   DETAIL
========================= */

.detail {
    display: none;
}

.detail.show {
    display: block;
}

.detail-header {
    padding: 22px;
    border-bottom: 1px solid var(--line);
}

.detail-category {
    color: var(--point);
    font-size: 13px;
    font-weight: 800;
}

.detail-title {
    font-size: 24px;
    font-weight: 800;
    margin: 10px 0 15px;
    word-break: break-word;
}

.detail-info {
    color: var(--sub);
    font-size: 13px;
}

.detail-content {
    padding: 25px 22px;
    min-height: 250px;

    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.7;
}

.detail-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;

    padding: 15px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
}

.detail-actions button {
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--text);

    padding: 10px 18px;
    border-radius: 7px;
    cursor: pointer;
}

.detail-actions button:hover {
    background: var(--point-light);
}

.back-btn {
    margin-bottom: 12px;
    border: 0;
    background: transparent;
    color: var(--point);
    cursor: pointer;
    font-weight: 700;
}

/* =========================
   COMMENTS
========================= */

.comments {
    padding: 20px;
}

.comments-title {
    font-weight: 800;
    margin-bottom: 15px;
}

.comment {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
}

.comment-author {
    font-size: 13px;
    font-weight: 800;
}

.comment-date {
    color: var(--sub);
    font-size: 11px;
    margin-left: 7px;
}

.comment-text {
    margin-top: 7px;
    white-space: pre-wrap;
    word-break: break-word;
}

.comment-form {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.comment-form input {
    flex: 1;
    min-width: 0;

    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);

    padding: 11px;
    border-radius: 7px;
}

.comment-form button {
    border: 0;
    background: var(--point);
    color: white;

    padding: 0 18px;
    border-radius: 7px;
    cursor: pointer;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;
    inset: 0;
    z-index: 1000;

    background: rgba(0,0,0,.55);

    align-items: center;
    justify-content: center;

    padding: 20px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 420px;

    background: var(--card);
    color: var(--text);

    border-radius: 12px;
    padding: 22px;
}

.modal-box h2 {
    margin-top: 0;
}

.modal-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;

    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);

    border-radius: 7px;
}

.modal-buttons {
    display: flex;
    gap: 8px;
}

.modal-buttons button {
    flex: 1;
    padding: 11px;
    border: 0;
    border-radius: 7px;
    cursor: pointer;
}

.modal-save {
    background: var(--point);
    color: white;
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    color: var(--sub);
    padding: 35px 20px;
    font-size: 12px;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .container {
        grid-template-columns: 190px minmax(0, 1fr);
    }

    .right-column {
        display: none;
    }

}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .header-inner {
        min-height: 0;
        padding: 10px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .logo {
        font-size: 23px;
    }

    .header-buttons {
        margin-left: auto;
    }

    .header-buttons button {
        height: 38px;
        padding: 0 10px;
    }

    .search {
        order: 3;
        flex-basis: 100%;
    }

    .container {
        display: block;
        margin: 12px auto;
        padding: 0 10px;
    }

    .sidebar {
        margin-bottom: 12px;
        overflow-x: auto;
    }

    .sidebar-title {
        display: none;
    }

    .gallery {
        display: flex;
        padding: 7px;
        gap: 5px;
        white-space: nowrap;
    }

    .gallery button {
        width: auto;
        padding: 9px 13px;
    }

    .page-title h1 {
        font-size: 20px;
    }

    .detail-title {
        font-size: 20px;
    }

    .detail-header,
    .detail-content {
        padding: 18px;
    }

    .comment-form {
        flex-direction: column;
    }

    .comment-form button {
        height: 42px;
    }

}

/* =========================
   SMALL PHONE
========================= */

@media (max-width: 450px) {

    .header-buttons button {
        min-width: 38px;
        padding: 0 8px;
    }

    .header-buttons button:last-child {
        max-width: 70px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .post {
        padding: 14px;
    }

    .post-info {
        gap: 8px;
        flex-wrap: wrap;
    }

}
</style>
</head>

<script>

/* =========================
   DATA
========================= */

let posts =
    JSON.parse(
        localStorage.getItem("washu_posts")
    ) || [];

let currentCategory = "전체";

let currentTab = "latest";

let currentPostId = null;


/* =========================
   SAVE
========================= */

function savePosts() {

    localStorage.setItem(
        "washu_posts",
        JSON.stringify(posts)
    );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


/* =========================
   DATE
========================= */

function formatDate(date) {

    const d = new Date(date);

    const now = new Date();

    const diff =
        Math.floor(
            (now - d) / 1000
        );


    if (diff < 60)
        return "방금 전";


    if (diff < 3600)
        return (
            Math.floor(diff / 60) +
            "분 전"
        );


    if (diff < 86400)
        return (
            Math.floor(diff / 3600) +
            "시간 전"
        );


    if (
        d.getFullYear() ===
        now.getFullYear()
    ) {

        return (
            (d.getMonth() + 1) +
            "." +
            d.getDate()
        );

    }


    return (
        d.getFullYear() +
        "." +
        (d.getMonth() + 1) +
        "." +
        d.getDate()
    );

}


/* =========================
   RENDER POSTS
========================= */

function renderPosts() {

    const container =
        document.getElementById("posts");


    let filtered =
        currentCategory === "전체"
            ? [...posts]
            : posts.filter(
                p =>
                    p.category ===
                    currentCategory
            );


    if (currentTab === "latest") {

        filtered.sort(
            (a, b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    } else {

        filtered.sort(
            (a, b) =>
                (
                    b.likes * 3 +
                    b.comments.length * 2 +
                    b.views
                )
                -
                (
                    a.likes * 3 +
                    a.comments.length * 2 +
                    a.views
                )
        );

    }


    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                아직 게시글이 없습니다.
                <br><br>
                첫 번째 글을 작성해보세요!
            </div>
        `;

        updateStats();
        renderPopular();

        return;

    }


    container.innerHTML =
        filtered.map(post => `

            <div
                class="post"
                onclick="openPost(${post.id})"
            >

                <div class="post-title">

                    ${escapeHTML(post.title)}

                    ${
                        post.comments.length
                        ? `
                            <span class="comment-count">
                                [${post.comments.length}]
                            </span>
                        `
                        : ""
                    }

                </div>


                <div class="post-content-preview">
                    ${escapeHTML(post.content)}
                </div>


                <div class="post-info">

                    <span class="category">
                        ${escapeHTML(post.category)}
                    </span>

                    <span>
                        ${escapeHTML(post.nickname)}
                    </span>

                    <span>
                        ${formatDate(post.date)}
                    </span>

                    <span>
                        조회 ${post.views}
                    </span>

                    <span>
                        추천 ${post.likes}
                    </span>

                </div>

            </div>

        `).join("");


    updateStats();

    renderPopular();

}


/* =========================
   POPULAR
========================= */

function renderPopular() {

    const box =
        document.getElementById(
            "popularPosts"
        );


    const popular =
        [...posts]
        .sort(
            (a, b) =>
                (
                    b.likes * 3 +
                    b.comments.length * 2 +
                    b.views
                )
                -
                (
                    a.likes * 3 +
                    a.comments.length * 2 +
                    a.views
                )
        )
        .slice(0, 5);


    if (!popular.length) {

        box.innerHTML = `
            <div
                style="
                    padding:15px;
                    color:var(--sub);
                "
            >
                인기글이 없습니다.
            </div>
        `;

        return;

    }


    box.innerHTML =
        popular.map(
            (post, index) => `

                <div
                    class="popular"
                    onclick="openPost(${post.id})"
                >

                    <div class="popular-title">
                        ${index + 1}.
                        ${escapeHTML(post.title)}
                    </div>

                    <div class="popular-info">
                        👍 ${post.likes}
                        · 💬 ${post.comments.length}
                        · 👁️ ${post.views}
                    </div>

                </div>

            `
        ).join("");

}


/* =========================
   WRITE
========================= */

function openWriteForm() {

    document
        .getElementById("writeForm")
        .classList.add("show");


    document
        .getElementById("nickname")
        .value =
        localStorage.getItem(
            "washu_nickname"
        ) || "";

}


function closeWriteForm() {

    document
        .getElementById("writeForm")
        .classList.remove("show");

}


function submitPost() {

    const category =
        document.getElementById(
            "category"
        ).value;


    let nickname =
        document.getElementById(
            "nickname"
        ).value.trim();


    const title =
        document.getElementById(
            "title"
        ).value.trim();


    const content =
        document.getElementById(
            "content"
        ).value.trim();


    if (!nickname) {

        nickname =
            localStorage.getItem(
                "washu_nickname"
            ) ||
            "익명";

    }


    if (!title) {

        alert("제목을 입력하세요.");
        return;

    }


    if (!content) {

        alert("내용을 입력하세요.");
        return;

    }


    localStorage.setItem(
        "washu_nickname",
        nickname
    );


    const post = {

        id: Date.now(),

        category,

        nickname,

        title,

        content,

        views: 0,

        likes: 0,

        dislikes: 0,

        comments: [],

        date:
            new Date().toISOString()

    };


    posts.unshift(post);

    savePosts();


    document.getElementById(
        "title"
    ).value = "";


    document.getElementById(
        "content"
    ).value = "";


    closeWriteForm();

    renderPosts();

    alert("게시글이 등록되었습니다.");

}


/* =========================
   OPEN POST
========================= */

function openPost(id) {

    const post =
        posts.find(
            p => p.id === id
        );


    if (!post) return;


    post.views++;

    savePosts();

    currentPostId = id;


    document.getElementById(
        "listPage"
    ).style.display = "none";


    document.getElementById(
        "detailPage"
    ).classList.add("show");


    document.getElementById(
        "detailCategory"
    ).textContent =
        post.category;


    document.getElementById(
        "detailTitle"
    ).textContent =
        post.title;


    document.getElementById(
        "detailInfo"
    ).textContent =
        `${post.nickname} · ${formatDate(post.date)} · 조회 ${post.views}`;


    document.getElementById(
        "detailContent"
    ).textContent =
        post.content;


    document.getElementById(
        "likeCount"
    ).textContent =
        post.likes;


    document.getElementById(
        "dislikeCount"
    ).textContent =
        post.dislikes;


    renderComments();

}


/* =========================
   COMMENTS
========================= */

function renderComments() {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    const box =
        document.getElementById(
            "commentsList"
        );


    document.getElementById(
        "commentCount"
    ).textContent =
        post.comments.length;


    if (!post.comments.length) {

        box.innerHTML = `
            <div style="color:var(--sub);">
                아직 댓글이 없습니다.
            </div>
        `;

        return;

    }


    box.innerHTML =
        post.comments.map(
            comment => `

                <div class="comment">

                    <span class="comment-author">
                        ${escapeHTML(
                            comment.nickname
                        )}
                    </span>

                    <span class="comment-date">
                        ${formatDate(
                            comment.date
                        )}
                    </span>

                    <div class="comment-text">
                        ${escapeHTML(
                            comment.text
                        )}
                    </div>

                </div>

            `
        ).join("");

}


function addComment() {

    const input =
        document.getElementById(
            "commentInput"
        );


    const text =
        input.value.trim();


    if (!text) {

        alert("댓글을 입력하세요.");
        return;

    }


    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    const nickname =
        localStorage.getItem(
            "washu_nickname"
        ) ||
        "익명";


    post.comments.push({

        id: Date.now(),

        nickname,

        text,

        date:
            new Date().toISOString()

    });


    input.value = "";

    savePosts();

    renderComments();

    renderPosts();

}


/* =========================
   LIKE
========================= */

function likePost() {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    post.likes++;

    savePosts();

    openPostWithoutView();

}


/* =========================
   DISLIKE
========================= */

function dislikePost() {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    post.dislikes++;

    savePosts();

    openPostWithoutView();

}


/* =========================
   REFRESH DETAIL
========================= */

function openPostWithoutView() {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    document.getElementById(
        "likeCount"
    ).textContent =
        post.likes;


    document.getElementById(
        "dislikeCount"
    ).textContent =
        post.dislikes;


    renderPosts();

    renderPopular();

}


/* =========================
   EDIT
========================= */

function editCurrentPost() {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    const newTitle =
        prompt(
            "제목 수정",
            post.title
        );


    if (newTitle === null)
        return;


    const newContent =
        prompt(
            "내용 수정",
            post.content
        );


    if (newContent === null)
        return;


    if (
        !newTitle.trim() ||
        !newContent.trim()
    ) {

        alert(
            "제목과 내용을 비워둘 수 없습니다."
        );

        return;

    }


    post.title =
        newTitle.trim();


    post.content =
        newContent.trim();


    savePosts();

    openPostWithoutView();


    document.getElementById(
        "detailTitle"
    ).textContent =
        post.title;


    document.getElementById(
        "detailContent"
    ).textContent =
        post.content;

}


/* =========================
   DELETE
========================= */

function deleteCurrentPost() {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if (!post) return;


    if (
        !confirm(
            "정말 이 게시글을 삭제하시겠습니까?"
        )
    ) return;


    posts =
        posts.filter(
            p => p.id !== currentPostId
        );


    savePosts();

    goHome();

}


/* =========================
   HOME
========================= */

function goHome() {

    currentPostId = null;


    document
        .getElementById("detailPage")
        .classList.remove("show");


    document
        .getElementById("listPage")
        .style.display = "block";


    renderPosts();

}


/* =========================
   CATEGORY
========================= */

function selectCategory(
    category,
    button
) {

    currentCategory = category;


    document
        .querySelectorAll(
            ".gallery button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    button.classList.add("active");


    document.getElementById(
        "pageTitle"
    ).textContent =
        category === "전체"
            ? "와슈 커뮤니티"
            : category + " 게시판";


    renderPosts();

}


/* =========================
   TAB
========================= */

function changeTab(
    tab,
    button
) {

    currentTab = tab;


    document
        .querySelectorAll(
            ".tabs button"
        )
        .forEach(
            b =>
                b.classList.remove(
                    "active"
                )
        );


    button.classList.add("active");

    renderPosts();

}


/* =========================
   SEARCH
========================= */

function searchPosts() {

    const keyword =
        document.getElementById(
            "searchInput"
        ).value.trim().toLowerCase();


    if (!keyword) {

        renderPosts();
        return;

    }


    const result =
        posts.filter(
            post =>

                post.title
                    .toLowerCase()
                    .includes(keyword)

                ||

                post.content
                    .toLowerCase()
                    .includes(keyword)

                ||

                post.nickname
                    .toLowerCase()
                    .includes(keyword)

                ||

                post.category
                    .toLowerCase()
                    .includes(keyword)

        );


    const container =
        document.getElementById(
            "posts"
        );


    if (!result.length) {

        container.innerHTML = `
            <div class="empty">
                "${escapeHTML(keyword)}"
                검색 결과가 없습니다.
            </div>
        `;

        return;

    }


    container.innerHTML =
        result.map(
            post => `

                <div
                    class="post"
                    onclick="openPost(${post.id})"
                >

                    <div class="post-title">

                        ${escapeHTML(
                            post.title
                        )}

                        ${
                            post.comments.length
                            ? `
                                <span class="comment-count">
                                    [${post.comments.length}]
                                </span>
                            `
                            : ""
                        }

                    </div>


                    <div class="post-content-preview">
                        ${escapeHTML(
                            post.content
                        )}
                    </div>


                    <div class="post-info">

                        <span class="category">
                            ${escapeHTML(
                                post.category
                            )}
                        </span>

                        <span>
                            ${escapeHTML(
                                post.nickname
                            )}
                        </span>

                        <span>
                            ${formatDate(
                                post.date
                            )}
                        </span>

                        <span>
                            조회 ${post.views}
                        </span>

                    </div>

                </div>

            `
        ).join("");

}


/* =========================
   NICKNAME
========================= */

function openNickname() {

    document
        .getElementById(
            "nicknameModal"
        )
        .classList.add("show");


    document
        .getElementById(
            "nicknameSetting"
        )
        .value =
        localStorage.getItem(
            "washu_nickname"
        ) || "";

}


function closeNickname() {

    document
        .getElementById(
            "nicknameModal"
        )
        .classList.remove("show");

}


function saveNickname() {

    const nickname =
        document
            .getElementById(
                "nicknameSetting"
            )
            .value
            .trim();


    if (!nickname) {

        alert("닉네임을 입력하세요.");
        return;

    }


    localStorage.setItem(
        "washu_nickname",
        nickname
    );


    closeNickname();

    alert("닉네임이 저장되었습니다.");

}


/* =========================
   DARK MODE
========================= */

function updateDarkModeButton() {

    const button =
        document.getElementById(
            "darkModeBtn"
        );


    if (!button) return;


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    button.textContent =
        isDark ? "☀️" : "🌙";


    button.title =
        isDark
            ? "라이트모드"
            : "다크모드";

}


function toggleDark() {

    document.body.classList.toggle(
        "dark"
    );


    const isDark =
        document.body.classList.contains(
            "dark"
        );


    localStorage.setItem(
        "washu_dark",
        isDark
    );


    updateDarkModeButton();

}


/* =========================
   STATS
========================= */

function updateStats() {

    document.getElementById(
        "totalPosts"
    ).textContent =
        posts.length;


    const comments =
        posts.reduce(
            (total, post) =>
                total +
                post.comments.length,
            0
        );


    document.getElementById(
        "totalComments"
    ).textContent =
        comments;

}


/* =========================
   INITIALIZE
========================= */

if (
    localStorage.getItem(
        "washu_dark"
    ) === "true"
) {

    document.body.classList.add(
        "dark"
    );

}


updateDarkModeButton();

renderPosts();

</script>

</body>
</html>
