<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALL — 커뮤니티</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
}

a {
    color: inherit;
    text-decoration: none;
}

.header {
    height: 64px;
    background: #fff;
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
}

.header-inner {
    width: 1180px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 30px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    color: #2463eb;
}

.search {
    flex: 1;
    max-width: 500px;
    position: relative;
}

.search input {
    width: 100%;
    height: 40px;
    border: 1px solid #d8dce3;
    border-radius: 8px;
    padding: 0 45px 0 14px;
    font-size: 14px;
    outline: none;
}

.search input:focus {
    border-color: #2463eb;
}

.search button {
    position: absolute;
    right: 5px;
    top: 5px;
    height: 30px;
    width: 35px;
    border: 0;
    background: transparent;
    cursor: pointer;
}

.login {
    margin-left: auto;
    border: 1px solid #ddd;
    background: white;
    padding: 9px 15px;
    border-radius: 7px;
    cursor: pointer;
}

.container {
    width: 1180px;
    margin: 25px auto;
    display: grid;
    grid-template-columns: 240px 1fr 250px;
    gap: 18px;
}

.card {
    background: white;
    border: 1px solid #e1e4e8;
    border-radius: 9px;
}

.card-title {
    padding: 16px;
    font-weight: 700;
    border-bottom: 1px solid #eee;
}

.gallery-list a {
    display: block;
    padding: 10px 16px;
    font-size: 14px;
}

.gallery-list a:hover {
    background: #f2f6ff;
    color: #2463eb;
}

.gallery-list .active {
    color: #2463eb;
    font-weight: 700;
    background: #f2f6ff;
}

.main-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
}

.tabs {
    display: flex;
    border-bottom: 1px solid #ddd;
}

.tabs button {
    border: 0;
    background: white;
    padding: 13px 18px;
    cursor: pointer;
    font-weight: 600;
    color: #777;
}

.tabs button.active {
    color: #2463eb;
    border-bottom: 2px solid #2463eb;
}

.post {
    display: flex;
    align-items: center;
    min-height: 48px;
    padding: 0 15px;
    border-bottom: 1px solid #f0f0f0;
    font-size: 14px;
}

.post:hover {
    background: #fafbfc;
}

.post-number {
    width: 45px;
    color: #999;
    text-align: center;
}

.post-title {
    flex: 1;
}

.comment {
    color: #2463eb;
    font-size: 12px;
    margin-left: 5px;
}

.post-info {
    width: 110px;
    color: #999;
    font-size: 12px;
    text-align: right;
}

.write {
    display: flex;
    justify-content: flex-end;
    padding: 12px;
}

.write button {
    background: #2463eb;
    color: white;
    border: 0;
    border-radius: 6px;
    padding: 9px 14px;
    cursor: pointer;
}

.rank-item {
    display: flex;
    padding: 11px 15px;
    border-bottom: 1px solid #f1f1f1;
    font-size: 13px;
}

.rank {
    width: 25px;
    font-weight: 700;
    color: #2463eb;
}

.rank-title {
    flex: 1;
}

.ad {
    height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 18px;
}

.footer {
    width: 1180px;
    margin: 50px auto;
    color: #999;
    font-size: 12px;
    border-top: 1px solid #ddd;
    padding-top: 20px;
}

@media (max-width: 900px) {
    .header-inner,
    .container,
    .footer {
        width: calc(100% - 24px);
    }

    .container {
        grid-template-columns: 1fr;
    }

    .right {
        display: none;
    }

    .left {
        display: none;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a class="logo" href="#">GALL</a>

        <div class="search">
            <input id="searchInput" type="text" placeholder="갤러리 또는 게시글 검색">
            <button onclick="search()">🔍</button>
        </div>

        <button class="login" onclick="login()">
            로그인
        </button>

    </div>
</header>


<main class="container">

    <!-- 왼쪽 -->
    <aside class="left">

        <div class="card">
            <div class="card-title">
                갤러리
            </div>

            <div class="gallery-list">
                <a href="#" class="active">전체 갤러리</a>
                <a href="#">게임</a>
                <a href="#">음악</a>
                <a href="#">학교/공부</a>
                <a href="#">스포츠</a>
                <a href="#">유머</a>
                <a href="#">자유</a>
                <a href="#">IT/컴퓨터</a>
                <a href="#">애니/만화</a>
            </div>
        </div>

    </aside>


    <!-- 가운데 -->
    <section>

        <div class="main-title">
            실시간 인기글
        </div>

        <div class="card">

            <div class="tabs">
                <button class="active">인기글</button>
                <button>최신글</button>
            </div>

            <div id="posts">

                <div class="post">
                    <div class="post-number">1</div>
                    <div class="post-title">
                        오늘 학교에서 있었던 일
                        <span class="comment">[32]</span>
                    </div>
                    <div class="post-info">1,284</div>
                </div>

                <div class="post">
                    <div class="post-number">2</div>
                    <div class="post-title">
                        이 게임 진짜 재밌네
                        <span class="comment">[18]</span>
                    </div>
                    <div class="post-info">932</div>
                </div>

                <div class="post">
                    <div class="post-number">3</div>
                    <div class="post-title">
                        시험 끝난 사람?
                        <span class="comment">[41]</span>
                    </div>
                    <div class="post-info">876</div>
                </div>

                <div class="post">
                    <div class="post-number">4</div>
                    <div class="post-title">
                        오늘 급식 뭐였음
                        <span class="comment">[27]</span>
                    </div>
                    <div class="post-info">741</div>
                </div>

                <div class="post">
                    <div class="post-number">5</div>
                    <div class="post-title">
                        컴퓨터 견적 질문
                        <span class="comment">[12]</span>
                    </div>
                    <div class="post-info">633</div>
                </div>

            </div>

            <div class="write">
                <button onclick="writePost()">글쓰기</button>
            </div>

        </div>

    </section>


    <!-- 오른쪽 -->
    <aside class="right">

        <div class="card ad">
            광고 영역
        </div>

        <div class="card">

            <div class="card-title">
                인기 갤러리
            </div>

            <div class="rank-item">
                <div class="rank">1</div>
                <div class="rank-title">게임 갤러리</div>
            </div>

            <div class="rank-item">
                <div class="rank">2</div>
                <div class="rank-title">자유 갤러리</div>
            </div>

            <div class="rank-item">
                <div class="rank">3</div>
                <div class="rank-title">음악 갤러리</div>
            </div>

            <div class="rank-item">
                <div class="rank">4</div>
                <div class="rank-title">유머 갤러리</div>
            </div>

        </div>

    </aside>

</main>


<footer class="footer">
    GALL Community · 이용약관 · 개인정보처리방침
</footer>


<script>

function login() {
    alert("로그인 기능은 다음 단계에서 연결합니다.");
}

function writePost() {
    alert("게시글 작성 기능은 다음 단계에서 연결합니다.");
}

function search() {

    const keyword =
        document.getElementById("searchInput").value.trim();

    if (!keyword) {
        alert("검색어를 입력해주세요.");
        return;
    }

    alert("'" + keyword + "' 검색 기능은 다음 단계에서 연결합니다.");
}

</script>

</body>
</html>
