<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>와슈 커뮤니티</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans KR", sans-serif;
    background: #f5f6f8;
    color: #222;
}

a {
    color: inherit;
    text-decoration: none;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

/* =========================
   HEADER
========================= */

.header {
    height: 64px;
    background: white;
    border-bottom: 1px solid #ddd;
    position: sticky;
    top: 0;
    z-index: 100;
}

.header-inner {
    width: min(1180px, calc(100% - 32px));
    height: 100%;
    margin: auto;

    display: flex;
    align-items: center;
    gap: 28px;
}

.logo {
    font-size: 24px;
    font-weight: 900;
    color: #2463eb;
    white-space: nowrap;
}

.search {
    flex: 1;
    max-width: 500px;
    position: relative;
}

.search input {
    width: 100%;
    height: 40px;

    border: 1px solid #d8dce3;
    border-radius: 8px;

    padding: 0 45px 0 14px;

    font-size: 14px;
    outline: none;
}

.search input:focus {
    border-color: #2463eb;
}

.search button {
    position: absolute;
    right: 5px;
    top: 5px;

    width: 35px;
    height: 30px;

    border: 0;
    background: transparent;
    cursor: pointer;
}

.login {
    margin-left: auto;

    border: 1px solid #ddd;
    background: white;

    padding: 9px 15px;
    border-radius: 7px;

    cursor: pointer;
    white-space: nowrap;
}

/* =========================
   MAIN
========================= */

.container {
    width: min(1180px, calc(100% - 32px));
    margin: 25px auto;

    display: grid;

    grid-template-columns:
        220px
        minmax(0, 1fr)
        240px;

    gap: 18px;
}

/* =========================
   CARD
========================= */

.card {
    background: white;
    border: 1px solid #e1e4e8;
    border-radius: 9px;
    overflow: hidden;
}

.card-title {
    padding: 16px;
    font-weight: 700;
    border-bottom: 1px solid #eee;
}

/* =========================
   GALLERY
========================= */

.gallery-list a {
    display: block;
    padding: 10px 16px;
    font-size: 14px;
}

.gallery-list a:hover {
    background: #f2f6ff;
    color: #2463eb;
}

.gallery-list .active {
    color: #2463eb;
    font-weight: 700;
    background: #f2f6ff;
}

/* =========================
   TITLE
========================= */

.main-title {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 18px;
}

/* =========================
   TABS
========================= */

.tabs {
    display: flex;
    border-bottom: 1px solid #ddd;
}

.tabs button {
    border: 0;
    background: white;
    padding: 13px 18px;

    cursor: pointer;

    font-weight: 600;
    color: #777;
}

.tabs button.active {
    color: #2463eb;
    border-bottom: 2px solid #2463eb;
}

/* =========================
   POST
========================= */

.post {
    display: flex;
    align-items: center;

    min-height: 50px;

    padding: 0 15px;

    border-bottom: 1px solid #f0f0f0;

    font-size: 14px;

    cursor: pointer;
}

.post:hover {
    background: #fafbfc;
}

.post-number {
    width: 45px;

    color: #999;

    text-align: center;

    flex-shrink: 0;
}

.post-title {
    flex: 1;

    min-width: 0;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.comment {
    color: #2463eb;

    font-size: 12px;

    margin-left: 5px;
}

.post-info {
    width: 100px;

    color: #999;

    font-size: 12px;

    text-align: right;

    flex-shrink: 0;
}

/* =========================
   EMPTY
========================= */

.empty {
    padding: 60px 20px;

    text-align: center;

    color: #999;

    font-size: 14px;
}

/* =========================
   WRITE
========================= */

.write {
    display: flex;

    justify-content: flex-end;

    padding: 12px;
}

.write button {
    background: #2463eb;

    color: white;

    border: 0;

    border-radius: 6px;

    padding: 9px 16px;

    cursor: pointer;

    font-weight: 600;
}

.write button:hover {
    background: #1954d1;
}

/* =========================
   WRITE FORM
========================= */

.write-form {
    display: none;

    padding: 18px;

    border-top: 1px solid #eee;
}

.write-form.show {
    display: block;
}

.write-form input,
.write-form textarea,
.write-form select {
    width: 100%;

    border: 1px solid #d8dce3;

    border-radius: 7px;

    outline: none;

    font-size: 14px;
}

.write-form input,
.write-form select {
    height: 42px;

    padding: 0 12px;

    margin-bottom: 10px;
}

.write-form textarea {
    min-height: 150px;

    padding: 12px;

    resize: vertical;

    margin-bottom: 10px;
}

.write-form input:focus,
.write-form textarea:focus,
.write-form select:focus {
    border-color: #2463eb;
}

.form-buttons {
    display: flex;

    justify-content: flex-end;

    gap: 8px;
}

.form-buttons button {
    border: 0;

    border-radius: 6px;

    padding: 9px 15px;

    cursor: pointer;
}

.cancel-button {
    background: #eee;
}

.submit-button {
    background: #2463eb;
    color: white;
}

/* =========================
   RIGHT
========================= */

.ad {
    height: 150px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #aaa;

    font-size: 12px;

    margin-bottom: 18px;
}

.rank-item {
    display: flex;

    padding: 11px 15px;

    border-bottom: 1px solid #f1f1f1;

    font-size: 13px;
}

.rank {
    width: 25px;

    font-weight: 700;

    color: #2463eb;
}

.rank-title {
    flex: 1;
}

/* =========================
   FOOTER
========================= */

.footer {
    width: min(1180px, calc(100% - 32px));

    margin: 50px auto;

    color: #999;

    font-size: 12px;

    border-top: 1px solid #ddd;

    padding-top: 20px;
}

/* =========================
   TABLET
========================= */

@media (max-width: 1000px) {

    .container {
        grid-template-columns:
            190px
            minmax(0, 1fr);
    }

    .right {
        display: none;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    body {
        background: white;
    }

    .header {
        height: auto;
    }

    .header-inner {
        width: 100%;

        padding: 10px 12px;

        display: grid;

        grid-template-columns:
            auto
            1fr
            auto;

        gap: 10px;
    }

    .logo {
        font-size: 20px;
    }

    .search {
        width: 100%;
    }

    .search input {
        height: 36px;
        font-size: 13px;
    }

    .login {
        padding: 8px 10px;
        font-size: 12px;
    }

    .container {
        width: 100%;

        margin: 0;

        display: block;
    }

    .left {
        display: block;

        border-bottom: 1px solid #ddd;
    }

    .left .card {
        border: 0;
        border-radius: 0;
    }

    .card-title {
        padding: 13px 14px;
    }

    .gallery-list {
        display: flex;

        overflow-x: auto;

        white-space: nowrap;

        scrollbar-width: none;
    }

    .gallery-list::-webkit-scrollbar {
        display: none;
    }

    .gallery-list a {
        display: inline-block;

        padding: 10px 14px;

        font-size: 13px;
    }

    .main-title {
        margin: 18px 14px 12px;

        font-size: 19px;
    }

    .card {
        border-left: 0;
        border-right: 0;
        border-radius: 0;
    }

    .post {
        min-height: 50px;

        padding: 0 12px;

        font-size: 13px;
    }

    .post-number {
        width: 30px;

        font-size: 12px;
    }

    .post-info {
        width: 50px;

        font-size: 11px;
    }

    .comment {
        font-size: 11px;
    }

    .write {
        padding: 10px 12px;
    }

    .write button {
        width: 100%;

        height: 40px;
    }

    .write-form {
        padding: 14px;
    }

    .write-form textarea {
        min-height: 130px;
    }

    .footer {
        width: 100%;

        margin: 30px 0;

        padding: 18px 14px;
    }
}

/* =========================
   SMALL PHONE
========================= */

@media (max-width: 380px) {

    .header-inner {
        grid-template-columns:
            auto
            1fr;
    }

    .login {
        display: none;
    }

    .logo {
        font-size: 19px;
    }

    .post-info {
        display: none;
    }
}
</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-inner">

        <a class="logo" href="#">
            와슈
        </a>

        <div class="search">

            <input
                id="searchInput"
                type="text"
                placeholder="갤러리 또는 게시글 검색"
            >

            <button onclick="search()">
                🔍
            </button>

        </div>

        <button
            class="login"
            onclick="login()"
        >
            로그인
        </button>

    </div>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="container">


    <!-- LEFT -->

    <aside class="left">

        <div class="card">

            <div class="card-title">
                갤러리
            </div>

            <div class="gallery-list">

                <a
                    href="#"
                    class="active"
                >
                    전체
                </a>

                <a href="#">
                    게임
                </a>

                <a href="#">
                    음악
                </a>

                <a href="#">
                    자유
                </a>

                <a href="#">
                    유머
                </a>

                <a href="#">
                    스포츠
                </a>

                <a href="#">
                    IT/컴퓨터
                </a>

                <a href="#">
                    애니/만화
                </a>

            </div>

        </div>

    </aside>



    <!-- CENTER -->

    <section>

        <div class="main-title">
            와슈 커뮤니티
        </div>


        <div class="card">


            <!-- TABS -->

            <div class="tabs">

                <button
                    class="active"
                    onclick="changeTab(this)"
                >
                    최신글
                </button>

                <button
                    onclick="changeTab(this)"
                >
                    인기글
                </button>

            </div>



            <!-- POSTS -->

            <div id="posts">

                <div class="empty" id="emptyMessage">
                    아직 게시글이 없습니다.<br>
                    첫 번째 글을 작성해보세요!
                </div>

            </div>



            <!-- WRITE BUTTON -->

            <div class="write">

                <button onclick="openWriteForm()">
                    + 글쓰기
                </button>

            </div>



            <!-- WRITE FORM -->

            <div
                class="write-form"
                id="writeForm"
            >

                <select id="category">

                    <option value="자유">
                        자유
                    </option>

                    <option value="게임">
                        게임
                    </option>

                    <option value="음악">
                        음악
                    </option>

                    <option value="유머">
                        유머
                    </option>

                    <option value="스포츠">
                        스포츠
                    </option>

                    <option value="IT/컴퓨터">
                        IT/컴퓨터
                    </option>

                </select>


                <input
                    id="nickname"
                    type="text"
                    maxlength="20"
                    placeholder="닉네임"
                >


                <input
                    id="title"
                    type="text"
                    maxlength="100"
                    placeholder="제목"
                >


                <textarea
                    id="content"
                    maxlength="5000"
                    placeholder="내용을 입력하세요."
                ></textarea>


                <div class="form-buttons">

                    <button
                        class="cancel-button"
                        onclick="closeWriteForm()"
                    >
                        취소
                    </button>

                    <button
                        class="submit-button"
                        onclick="submitPost()"
                    >
                        게시하기
                    </button>

                </div>

            </div>

        </div>

    </section>



    <!-- RIGHT -->

    <aside class="right">


        <div class="card ad">
            광고 영역
        </div>


        <div class="card">

            <div class="card-title">
                인기 갤러리
            </div>


            <div class="rank-item">

                <div class="rank">
                    1
                </div>

                <div class="rank-title">
                    게임
                </div>

            </div>


            <div class="rank-item">

                <div class="rank">
                    2
                </div>

                <div class="rank-title">
                    자유
                </div>

            </div>


            <div class="rank-item">

                <div class="rank">
                    3
                </div>

                <div class="rank-title">
                    음악
                </div>

            </div>


            <div class="rank-item">

                <div class="rank">
                    4
                </div>

                <div class="rank-title">
                    유머
                </div>

            </div>

        </div>

    </aside>

</main>



<footer class="footer">

    와슈 커뮤니티
    · 이용약관
    · 개인정보처리방침

</footer>



<script>

/* =========================
   게시글 데이터
========================= */

let posts =
    JSON.parse(
        localStorage.getItem("washu_posts")
    ) || [];


/* =========================
   게시글 화면 출력
========================= */

function renderPosts() {

    const postsContainer =
        document.getElementById("posts");

    postsContainer.innerHTML = "";


    if (posts.length === 0) {

        postsContainer.innerHTML = `
            <div class="empty">
                아직 게시글이 없습니다.<br>
                첫 번째 글을 작성해보세요!
            </div>
        `;

        return;
    }


    posts.forEach((post, index) => {

        const postElement =
            document.createElement("div");

        postElement.className = "post";


        postElement.innerHTML = `

            <div class="post-number">
                ${posts.length - index}
            </div>

            <div class="post-title">

                [${escapeHTML(post.category)}]

                ${escapeHTML(post.title)}

            </div>

            <div class="post-info">

                ${escapeHTML(post.nickname)}

            </div>

        `;


        postsContainer.appendChild(
            postElement
        );

    });

}


/* =========================
   글쓰기 창
========================= */

function openWriteForm() {

    const form =
        document.getElementById("writeForm");

    form.classList.add("show");

    document
        .getElementById("nickname")
        .focus();

}


function closeWriteForm() {

    document
        .getElementById("writeForm")
        .classList.remove("show");

}


/* =========================
   게시글 작성
========================= */

function submitPost() {

    const category =
        document.getElementById("category").value;

    const nickname =
        document.getElementById("nickname").value.trim();

    const title =
        document.getElementById("title").value.trim();

    const content =
        document.getElementById("content").value.trim();


    if (!nickname) {

        alert("닉네임을 입력해주세요.");

        return;
    }


    if (!title) {

        alert("제목을 입력해주세요.");

        return;
    }


    if (!content) {

        alert("내용을 입력해주세요.");

        return;
    }


    const newPost = {

        id: Date.now(),

        category: category,

        nickname: nickname,

        title: title,

        content: content,

        views: 0,

        likes: 0,

        date: new Date().toISOString()

    };


    posts.unshift(newPost);


    localStorage.setItem(
        "washu_posts",
        JSON.stringify(posts)
    );


    document.getElementById("nickname").value = "";
    document.getElementById("title").value = "";
    document.getElementById("content").value = "";


    closeWriteForm();

    renderPosts();


    alert("게시글이 등록되었습니다.");

}


/* =========================
   검색
========================= */

function search() {

    const keyword =
        document
            .getElementById("searchInput")
            .value
            .trim();


    if (!keyword) {

        alert("검색어를 입력해주세요.");

        return;
    }


    alert(
        "'" +
        keyword +
        "' 검색 기능은 다음 단계에서 연결합니다."
    );

}


/* =========================
   로그인
========================= */

function login() {

    alert(
        "로그인 기능은 다음 단계에서 연결합니다."
    );

}


/* =========================
   탭
========================= */

function changeTab(button) {

    document
        .querySelectorAll(".tabs button")
        .forEach(btn => {

            btn.classList.remove("active");

        });


    button.classList.add("active");

}


/* =========================
   HTML 특수문자 방지
========================= */

function escapeHTML(value) {

    return String(value)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


/* =========================
   시작
========================= */

renderPosts();

</script>

</body>
</html>
