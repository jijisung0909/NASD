<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>와슈 커뮤니티</title>
<meta name="description" content="와슈 커뮤니티 - 자유롭게 이야기를 나누는 커뮤니티">

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #202124;
    --sub: #777b85;
    --line: #e4e6eb;
    --point: #4f46e5;
    --point-light: #eef2ff;
    --danger: #ef4444;
    --success: #16a34a;
    --shadow: 0 2px 8px rgba(0,0,0,.04);
}

body.dark {
    --bg: #101218;
    --card: #191c23;
    --text: #f3f4f6;
    --sub: #a6a9b2;
    --line: #2d313a;
    --point-light: #252a4b;
    --shadow: 0 2px 10px rgba(0,0,0,.2);
}

body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans KR",
        sans-serif;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--card);
    border-bottom: 1px solid var(--line);
}

.header-inner {
    max-width: 1400px;
    min-height: 64px;
    margin: auto;
    padding: 10px 20px;

    display: flex;
    align-items: center;
    gap: 20px;
}

.logo {
    color: var(--point);
    text-decoration: none;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -1px;
}

.search {
    flex: 1;
    max-width: 620px;
    margin: auto;
    display: flex;
}

.search input {
    width: 100%;
    height: 42px;
    border: 1px solid var(--line);
    border-right: 0;
    border-radius: 8px 0 0 8px;
    padding: 0 14px;
    background: var(--bg);
    color: var(--text);
    outline: none;
}

.search input:focus {
    border-color: var(--point);
}

.search button {
    width: 48px;
    border: 0;
    border-radius: 0 8px 8px 0;
    background: var(--point);
    color: white;
}

.header-buttons {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
}

.header-buttons button {
    min-width: 42px;
    height: 40px;
    padding: 0 11px;

    border: 1px solid var(--line);
    border-radius: 7px;

    background: var(--card);
    color: var(--text);
}

.header-buttons button:hover {
    background: var(--point-light);
}

.container {
    max-width: 1400px;
    margin: 24px auto;
    padding: 0 20px;

    display: grid;
    grid-template-columns: 220px minmax(0,1fr) 250px;
    gap: 20px;
}

.sidebar,
.card,
.right-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
}

.sidebar {
    height: fit-content;
    overflow: hidden;
}

.sidebar-title {
    padding: 17px;
    font-weight: 800;
    border-bottom: 1px solid var(--line);
}

.gallery {
    padding: 8px;
}

.gallery button {
    width: 100%;
    padding: 12px;

    border: 0;
    border-radius: 7px;

    background: transparent;
    color: var(--text);

    text-align: left;
}

.gallery button:hover,
.gallery button.active {
    background: var(--point-light);
    color: var(--point);
    font-weight: 700;
}

.gallery-count {
    float: right;
    color: var(--sub);
    font-size: 12px;
}

.page-title {
    margin-bottom: 14px;
}

.page-title h1 {
    margin: 0;
    font-size: 24px;
    letter-spacing: -.5px;
}

.page-title p {
    margin: 6px 0 0;
    color: var(--sub);
    font-size: 14px;
}

.tabs {
    display: flex;
    border-bottom: 1px solid var(--line);
}

.tabs button {
    flex: 1;
    padding: 14px;

    border: 0;
    border-bottom: 2px solid transparent;

    background: transparent;
    color: var(--sub);
}

.tabs button.active {
    color: var(--point);
    border-bottom-color: var(--point);
    font-weight: 800;
}

.search-info {
    display: none;
    padding: 12px 16px;
    background: var(--point-light);
    color: var(--point);
    font-size: 13px;
}

.post {
    position: relative;
    padding: 16px 18px;
    border-bottom: 1px solid var(--line);
}

.post:hover {
    background: var(--bg);
}

.post-title-row {
    display: flex;
    align-items: center;
    gap: 7px;
}

.post-title {
    font-size: 16px;
    font-weight: 700;
    word-break: break-word;
}

.comment-count {
    color: var(--point);
    font-size: 13px;
    font-weight: 700;
}

.badge {
    display: inline-flex;
    align-items: center;

    padding: 2px 6px;
    border-radius: 4px;

    font-size: 10px;
    font-weight: 900;
}

.badge.hot {
    background: #fee2e2;
    color: #dc2626;
}

.badge.new {
    background: #dcfce7;
    color: #16a34a;
}

.post-preview {
    margin-top: 7px;

    color: var(--sub);
    font-size: 13px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.post-info {
    display: flex;
    flex-wrap: wrap;
    gap: 11px;

    margin-top: 10px;

    color: var(--sub);
    font-size: 12px;
}

.category {
    color: var(--point);
    font-weight: 700;
}

mark {
    background: #fef08a;
    color: #111;
    padding: 0 2px;
    border-radius: 2px;
}

body.dark mark {
    background: #665c16;
    color: #fff;
}

.empty {
    padding: 65px 20px;
    text-align: center;
    color: var(--sub);
}

.write-area {
    padding: 14px;
}

.write-btn {
    width: 100%;
    height: 45px;

    border: 0;
    border-radius: 8px;

    background: var(--point);
    color: white;
    font-weight: 800;
}

.write-btn:hover {
    filter: brightness(.95);
}

.form {
    display: none;
    padding: 18px;
    border-top: 1px solid var(--line);
}

.form.show {
    display: block;
}

.form input,
.form textarea,
.form select {
    width: 100%;
    margin-bottom: 10px;

    border: 1px solid var(--line);
    border-radius: 7px;

    padding: 11px;

    background: var(--bg);
    color: var(--text);
    outline: none;
}

.form textarea {
    min-height: 190px;
    resize: vertical;
}

.form-buttons {
    display: flex;
    gap: 8px;
}

.form-buttons button {
    flex: 1;
    padding: 12px;
    border: 0;
    border-radius: 7px;
}

.cancel {
    background: var(--bg);
    color: var(--text);
}

.submit {
    background: var(--point);
    color: white;
}

.right-card {
    overflow: hidden;
    margin-bottom: 15px;
}

.right-title {
    padding: 15px;
    border-bottom: 1px solid var(--line);
    font-weight: 800;
}

.popular {
    padding: 13px 15px;
    border-bottom: 1px solid var(--line);
}

.popular:last-child {
    border-bottom: 0;
}

.popular:hover {
    background: var(--bg);
}

.popular-title {
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
}

.popular-info {
    margin-top: 5px;
    color: var(--sub);
    font-size: 11px;
}

.stats {
    padding: 15px;
    color: var(--sub);
    font-size: 13px;
    line-height: 2;
}

.stats strong {
    color: var(--text);
}

.detail {
    display: none;
}

.detail.show {
    display: block;
}

.back-btn {
    margin-bottom: 12px;

    border: 0;
    background: transparent;

    color: var(--point);
    font-weight: 800;
}

.detail-header {
    padding: 22px;
    border-bottom: 1px solid var(--line);
}

.detail-category {
    color: var(--point);
    font-size: 13px;
    font-weight: 800;
}

.detail-title {
    margin: 10px 0 14px;

    font-size: 24px;
    font-weight: 850;
    word-break: break-word;
}

.detail-info {
    color: var(--sub);
    font-size: 13px;
}

.detail-content {
    min-height: 260px;
    padding: 25px 22px;

    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
}

.detail-actions {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;

    padding: 15px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
}

.detail-actions button {
    padding: 9px 15px;

    border: 1px solid var(--line);
    border-radius: 7px;

    background: var(--card);
    color: var(--text);
}

.detail-actions button:hover {
    background: var(--point-light);
}

.comments {
    padding: 20px;
}

.comments-title {
    margin-bottom: 15px;
    font-weight: 800;
}

.comment {
    padding: 14px 0;
    border-bottom: 1px solid var(--line);
}

.comment-head {
    display: flex;
    align-items: center;
    gap: 7px;
}

.comment-author {
    font-size: 13px;
    font-weight: 800;
}

.comment-date {
    color: var(--sub);
    font-size: 11px;
}

.comment-text {
    margin-top: 7px;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.6;
}

.comment-buttons {
    display: flex;
    gap: 8px;
    margin-top: 7px;
}

.comment-buttons button {
    border: 0;
    background: transparent;
    color: var(--sub);
    padding: 2px;
    font-size: 11px;
}

.reply {
    margin: 10px 0 0 25px;
    padding: 10px 12px;

    border-left: 2px solid var(--point);
    background: var(--bg);
    border-radius: 0 7px 7px 0;
}

.comment-form {
    display: flex;
    gap: 8px;
    margin-top: 18px;
}

.comment-form input {
    flex: 1;
    min-width: 0;

    border: 1px solid var(--line);
    border-radius: 7px;

    padding: 11px;

    background: var(--bg);
    color: var(--text);
    outline: none;
}

.comment-form button {
    border: 0;
    border-radius: 7px;

    padding: 0 18px;

    background: var(--point);
    color: white;
}

.pagination {
    display: flex;
    justify-content: center;
    gap: 5px;

    padding: 17px;
}

.pagination button {
    min-width: 34px;
    height: 34px;

    border: 1px solid var(--line);
    border-radius: 6px;

    background: var(--card);
    color: var(--text);
}

.pagination button.active {
    background: var(--point);
    color: white;
    border-color: var(--point);
}

.pagination button:disabled {
    opacity: .4;
    cursor: default;
}

.modal {
    display: none;

    position: fixed;
    inset: 0;
    z-index: 1000;

    align-items: center;
    justify-content: center;

    padding: 20px;

    background: rgba(0,0,0,.55);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 420px;

    padding: 22px;

    border-radius: 12px;

    background: var(--card);
    color: var(--text);
}

.modal-box h2 {
    margin-top: 0;
}

.modal-box input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;

    border: 1px solid var(--line);
    border-radius: 7px;

    background: var(--bg);
    color: var(--text);
}

.modal-buttons {
    display: flex;
    gap: 8px;
}

.modal-buttons button {
    flex: 1;
    padding: 11px;

    border: 0;
    border-radius: 7px;
}

.modal-save {
    background: var(--point);
    color: white;
}

footer {
    padding: 35px 20px;

    text-align: center;

    color: var(--sub);
    font-size: 12px;
}

/* TABLET */

@media (max-width: 1000px) {

    .container {
        grid-template-columns: 190px minmax(0,1fr);
    }

    .right-column {
        display: none;
    }
}

/* MOBILE */

@media (max-width: 700px) {

    .header-inner {
        min-height: 0;
        padding: 10px;
        flex-wrap: wrap;
        gap: 9px;
    }

    .logo {
        font-size: 23px;
    }

    .header-buttons {
        margin-left: auto;
    }

    .header-buttons button {
        height: 38px;
        padding: 0 9px;
    }

    .search {
        order: 3;
        flex-basis: 100%;
    }

    .container {
        display: block;
        margin: 12px auto;
        padding: 0 9px;
    }

    .sidebar {
        margin-bottom: 12px;
        overflow-x: auto;
    }

    .sidebar-title {
        display: none;
    }

    .gallery {
        display: flex;
        gap: 4px;
        padding: 7px;
        white-space: nowrap;
    }

    .gallery button {
        width: auto;
        padding: 9px 12px;
    }

    .gallery-count {
        display: none;
    }

    .page-title h1 {
        font-size: 20px;
    }

    .post {
        padding: 14px;
    }

    .post-info {
        gap: 7px;
    }

    .detail-header {
        padding: 18px;
    }

    .detail-title {
        font-size: 20px;
    }

    .detail-content {
        padding: 20px 18px;
    }

    .comments {
        padding: 16px;
    }

    .comment-form {
        flex-direction: column;
    }

    .comment-form button {
        height: 42px;
    }

    .reply {
        margin-left: 15px;
    }
}

/* SMALL PHONE */

@media (max-width: 450px) {

    .header-buttons button {
        min-width: 38px;
        padding: 0 7px;
    }

    .header-buttons button:last-child {
        max-width: 65px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .detail-actions button {
        padding: 8px 11px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<header class="header">

<div class="header-inner">

<a
    class="logo"
    href="#"
    onclick="goHome();return false;"
>
    와슈
</a>

<div class="search">

<input
    id="searchInput"
    placeholder="게시글 검색"
    onkeydown="if(event.key==='Enter')searchPosts()"
>

<button onclick="searchPosts()">
    🔍
</button>

</div>

<div class="header-buttons">

<button
    id="darkModeBtn"
    onclick="toggleDark()"
>
    🌙
</button>

<button onclick="openNickname()">
    닉네임
</button>

</div>

</div>

</header>


<main class="container">

<!-- SIDEBAR -->

<aside class="sidebar">

<div class="sidebar-title">
    와슈 게시판
</div>

<div class="gallery">

<button
    class="active"
    onclick="selectCategory('전체',this)"
>
    전체
    <span class="gallery-count" id="count-전체">0</span>
</button>

<button onclick="selectCategory('자유',this)">
    💬 자유
    <span class="gallery-count" id="count-자유">0</span>
</button>

<button onclick="selectCategory('게임',this)">
    🎮 게임
    <span class="gallery-count" id="count-게임">0</span>
</button>

<button onclick="selectCategory('음악',this)">
    🎵 음악
    <span class="gallery-count" id="count-음악">0</span>
</button>

<button onclick="selectCategory('유머',this)">
    😂 유머
    <span class="gallery-count" id="count-유머">0</span>
</button>

<button onclick="selectCategory('스포츠',this)">
    ⚽ 스포츠
    <span class="gallery-count" id="count-스포츠">0</span>
</button>

<button onclick="selectCategory('IT/컴퓨터',this)">
    💻 IT/컴퓨터
    <span class="gallery-count" id="count-IT/컴퓨터">0</span>
</button>

<button onclick="selectCategory('애니/만화',this)">
    📺 애니/만화
    <span class="gallery-count" id="count-애니/만화">0</span>
</button>

</div>

</aside>


<!-- CENTER -->

<section>

<div id="listPage">

<div class="page-title">

<h1 id="pageTitle">
    와슈 커뮤니티
</h1>

<p>
    자유롭게 이야기를 나눠보세요.
</p>

</div>


<div class="card">

<div class="tabs">

<button
    class="active"
    onclick="changeTab('latest',this)"
>
    최신글
</button>

<button
    onclick="changeTab('popular',this)"
>
    인기글
</button>

</div>


<div
    id="searchInfo"
    class="search-info"
></div>


<div id="posts"></div>


<div
    id="pagination"
    class="pagination"
></div>


<div class="write-area">

<button
    class="write-btn"
    onclick="openWriteForm()"
>
    + 글쓰기
</button>

</div>


<div
    class="form"
    id="writeForm"
>

<select id="category">

<option value="자유">자유</option>
<option value="게임">게임</option>
<option value="음악">음악</option>
<option value="유머">유머</option>
<option value="스포츠">스포츠</option>
<option value="IT/컴퓨터">IT/컴퓨터</option>
<option value="애니/만화">애니/만화</option>

</select>


<input
    id="nickname"
    maxlength="20"
    placeholder="닉네임"
/>


<input
    id="title"
    maxlength="100"
    placeholder="제목"
/>


<textarea
    id="content"
    placeholder="내용을 입력하세요."
></textarea>


<div class="form-buttons">

<button
    class="cancel"
    onclick="closeWriteForm()"
>
    취소
</button>

<button
    class="submit"
    onclick="submitPost()"
>
    게시하기
</button>

</div>

</div>

</div>

</div>


<!-- DETAIL -->

<div
    id="detailPage"
    class="detail"
>

<button
    class="back-btn"
    onclick="goHome()"
>
    ← 목록으로
</button>


<div class="card">

<div class="detail-header">

<div
    id="detailCategory"
    class="detail-category"
></div>

<div
    id="detailTitle"
    class="detail-title"
></div>

<div
    id="detailInfo"
    class="detail-info"
></div>

</div>


<div
    id="detailContent"
    class="detail-content"
></div>


<div class="detail-actions">

<button onclick="likePost()">
    👍 <span id="likeCount">0</span>
</button>

<button onclick="dislikePost()">
    👎 <span id="dislikeCount">0</span>
</button>

<button onclick="editCurrentPost()">
    ✏️ 수정
</button>

<button onclick="deleteCurrentPost()">
    🗑️ 삭제
</button>

</div>


<div class="comments">

<div class="comments-title">
    댓글 <span id="commentCount">0</span>
</div>


<div id="commentsList"></div>


<div class="comment-form">

<input
    id="commentInput"
    maxlength="300"
    placeholder="댓글을 입력하세요."
    onkeydown="if(event.key==='Enter')addComment()"
/>

<button onclick="addComment()">
    등록
</button>

</div>

</div>

</div>

</div>

</section>


<!-- RIGHT -->

<aside class="right-column">

<div class="right-card">

<div class="right-title">
    🔥 인기글
</div>

<div id="popularPosts"></div>

</div>


<div class="right-card">

<div class="right-title">
    📊 와슈 통계
</div>

<div class="stats">

게시글
<strong id="totalPosts">0</strong>개

<br>

댓글
<strong id="totalComments">0</strong>개

<br>

추천
<strong id="totalLikes">0</strong>개

</div>

</div>

</aside>

</main>


<footer>
와슈 커뮤니티
<br><br>
DB 연결 전 테스트 버전
</footer>


<!-- NICKNAME MODAL -->

<div
    class="modal"
    id="nicknameModal"
>

<div class="modal-box">

<h2>
    닉네임 설정
</h2>

<input
    id="nicknameSetting"
    maxlength="20"
    placeholder="사용할 닉네임"
/>

<div class="modal-buttons">

<button onclick="closeNickname()">
    취소
</button>

<button
    class="modal-save"
    onclick="saveNickname()"
>
    저장
</button>

</div>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let posts =
    JSON.parse(
        localStorage.getItem("washu_posts")
    ) || [];

let currentCategory = "전체";
let currentTab = "latest";
let currentPostId = null;
let currentPage = 1;
let searchKeyword = "";

const POSTS_PER_PAGE = 10;


/* =========================
   DATA NORMALIZATION
========================= */

posts = posts.map(post => ({

    ...post,

    dislikes: post.dislikes || 0,

    comments: (post.comments || []).map(comment => ({

        ...comment,

        likes: comment.likes || 0,

        replies: comment.replies || []

    }))

}));


/* =========================
   SAVE
========================= */

function savePosts() {

    localStorage.setItem(
        "washu_posts",
        JSON.stringify(posts)
    );

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================
   SEARCH HIGHLIGHT
========================= */

function highlight(text) {

    const safe =
        escapeHTML(text);

    if (!searchKeyword)
        return safe;

    const escaped =
        searchKeyword
            .replace(
                /[.*+?^${}()|[\]\\]/g,
                "\\$&"
            );

    return safe.replace(
        new RegExp(
            "(" + escaped + ")",
            "gi"
        ),
        "<mark>$1</mark>"
    );

}


/* =========================
   DATE
========================= */

function formatDate(date) {

    const d =
        new Date(date);

    const now =
        new Date();

    const diff =
        Math.floor(
            (now-d)/1000
        );

    if(diff<60)
        return "방금 전";

    if(diff<3600)
        return Math.floor(diff/60)+"분 전";

    if(diff<86400)
        return Math.floor(diff/3600)+"시간 전";

    if(
        d.getFullYear() ===
        now.getFullYear()
    ) {

        return (
            (d.getMonth()+1)+
            "."+
            d.getDate()
        );

    }

    return (
        d.getFullYear()+
        "."+
        (d.getMonth()+1)+
        "."+
        d.getDate()
    );

}


/* =========================
   HOT / NEW
========================= */

function isNew(post) {

    const diff =
        Date.now() -
        new Date(post.date).getTime();

    return diff <
        24*60*60*1000;

}


function score(post) {

    return (
        post.likes * 3 +
        post.comments.length * 2 +
        post.views
    );

}


function isHot(post) {

    return score(post) >= 10;

}


/* =========================
   FILTER
========================= */

function getFilteredPosts() {

    let result =
        currentCategory === "전체"
            ? [...posts]
            : posts.filter(
                p =>
                    p.category ===
                    currentCategory
            );


    if(searchKeyword) {

        result =
            result.filter(post =>

                post.title
                    .toLowerCase()
                    .includes(
                        searchKeyword
                    )

                ||

                post.content
                    .toLowerCase()
                    .includes(
                        searchKeyword
                    )

                ||

                post.nickname
                    .toLowerCase()
                    .includes(
                        searchKeyword
                    )

                ||

                post.category
                    .toLowerCase()
                    .includes(
                        searchKeyword
                    )

            );

    }


    if(currentTab === "latest") {

        result.sort(
            (a,b) =>
                new Date(b.date) -
                new Date(a.date)
        );

    } else {

        result.sort(
            (a,b) =>
                score(b)-score(a)
        );

    }


    return result;

}


/* =========================
   RENDER
========================= */

function renderPosts() {

    const container =
        document.getElementById(
            "posts"
        );

    const all =
        getFilteredPosts();

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                all.length /
                POSTS_PER_PAGE
            )
        );


    if(currentPage > totalPages)
        currentPage = totalPages;


    const start =
        (currentPage-1) *
        POSTS_PER_PAGE;


    const pagePosts =
        all.slice(
            start,
            start+POSTS_PER_PAGE
        );


    if(!pagePosts.length) {

        container.innerHTML = `
            <div class="empty">
                ${
                    searchKeyword
                    ? "검색 결과가 없습니다."
                    : "아직 게시글이 없습니다."
                }

                <br><br>

                ${
                    searchKeyword
                    ? "다른 검색어를 입력해보세요."
                    : "첫 번째 글을 작성해보세요!"
                }
            </div>
        `;

    } else {

        container.innerHTML =
            pagePosts.map(post => `

                <div
                    class="post"
                    onclick="openPost(${post.id})"
                >

                <div class="post-title-row">

                    ${
                        isHot(post)
                        ? `<span class="badge hot">
                            HOT
                          </span>`
                        : ""
                    }

                    ${
                        isNew(post)
                        ? `<span class="badge new">
                            NEW
                          </span>`
                        : ""
                    }

                    <div class="post-title">

                        ${
                            searchKeyword
                            ? highlight(post.title)
                            : escapeHTML(post.title)
                        }

                        ${
                            post.comments.length
                            ? `
                                <span class="comment-count">
                                    [${post.comments.length}]
                                </span>
                            `
                            : ""
                        }

                    </div>

                </div>


                <div class="post-preview">

                    ${
                        searchKeyword
                        ? highlight(post.content)
                        : escapeHTML(post.content)
                    }

                </div>


                <div class="post-info">

                    <span class="category">
                        ${escapeHTML(post.category)}
                    </span>

                    <span>
                        ${escapeHTML(post.nickname)}
                    </span>

                    <span>
                        ${formatDate(post.date)}
                    </span>

                    <span>
                        👁 ${post.views}
                    </span>

                    <span>
                        👍 ${post.likes}
                    </span>

                </div>

                </div>

            `).join("");

    }


    renderPagination(totalPages);

    renderPopular();

    updateStats();

    updateGalleryCounts();

}


/* =========================
   PAGINATION
========================= */

function renderPagination(totalPages) {

    const box =
        document.getElementById(
            "pagination"
        );


    if(totalPages <= 1) {

        box.innerHTML = "";
        return;

    }


    let html = `

        <button
            onclick="changePage(${currentPage-1})"
            ${currentPage===1?"disabled":""}
        >
            ‹
        </button>

    `;


    let start =
        Math.max(
            1,
            currentPage-2
        );


    let end =
        Math.min(
            totalPages,
            start+4
        );


    if(end-start < 4)
        start =
            Math.max(
                1,
                end-4
            );


    for(
        let i=start;
        i<=end;
        i++
    ) {

        html += `

            <button
                class="${
                    i===currentPage
                    ? "active"
                    : ""
                }"
                onclick="changePage(${i})"
            >
                ${i}
            </button>

        `;

    }


    html += `

        <button
            onclick="changePage(${currentPage+1})"
            ${
                currentPage===totalPages
                ?"disabled":""
            }
        >
            ›
        </button>

    `;


    box.innerHTML = html;

}


function changePage(page) {

    const all =
        getFilteredPosts();

    const totalPages =
        Math.max(
            1,
            Math.ceil(
                all.length /
                POSTS_PER_PAGE
            )
        );


    if(
        page<1 ||
        page>totalPages
    )
        return;


    currentPage = page;

    renderPosts();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================
   POPULAR
========================= */

function renderPopular() {

    const box =
        document.getElementById(
            "popularPosts"
        );


    const popular =
        [...posts]
        .sort(
            (a,b) =>
                score(b)-score(a)
        )
        .slice(0,5);


    if(!popular.length) {

        box.innerHTML = `
            <div class="stats">
                인기글이 없습니다.
            </div>
        `;

        return;

    }


    box.innerHTML =
        popular.map(
            (post,index) => `

                <div class="popular">

                    <div
                        class="popular-title"
                        onclick="openPost(${post.id})"
                    >

                        ${index+1}.
                        ${escapeHTML(post.title)}

                    </div>

                    <div class="popular-info">

                        👍 ${post.likes}
                        · 💬 ${post.comments.length}
                        · 👁 ${post.views}

                    </div>

                </div>

            `
        ).join("");

}


/* =========================
   GALLERY COUNTS
========================= */

function updateGalleryCounts() {

    const categories = [
        "전체",
        "자유",
        "게임",
        "음악",
        "유머",
        "스포츠",
        "IT/컴퓨터",
        "애니/만화"
    ];


    categories.forEach(category => {

        const count =
            category === "전체"
            ? posts.length
            : posts.filter(
                p =>
                    p.category === category
            ).length;


        const element =
            document.getElementById(

            );


        if(element)
            element.textContent =
                count;

    });

/* =========================
   ADD COMMENT
========================= */

function addComment() {

    const input =
        document.getElementById(
            "commentInput"
        );


    const text =
        input.value.trim();


    if(!text) {

        alert("댓글을 입력하세요.");
        return;

    }


    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if(!post) return;


    const nickname =
        localStorage.getItem(
            "washu_nickname"
        ) ||
        "익명";


    post.comments.push({

        id:Date.now(),

        nickname,

        text,

        likes:0,

        replies:[],

        date:
            new Date().toISOString()

    });


    input.value = "";

    savePosts();

    renderComments();

    renderPosts();

}


/* =========================
   COMMENT LIKE
========================= */

function likeComment(id) {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if(!post) return;


    const comment =
        post.comments.find(
            c => c.id === id
        );


    if(!comment) return;


    comment.likes =
        (comment.likes || 0)+1;


    savePosts();

    renderComments();

}


/* =========================
   REPLY
========================= */

function replyComment(id) {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if(!post) return;


    const comment =
        post.comments.find(
            c => c.id === id
        );


    if(!comment) return;


    const text =
        prompt("답글을 입력하세요.");


    if(!text || !text.trim())
        return;


    const nickname =
        localStorage.getItem(
            "washu_nickname"
        ) ||
        "익명";


    if(!comment.replies)
        comment.replies = [];


    comment.replies.push({

        id:Date.now(),

        nickname,

        text:text.trim(),

        date:
            new Date().toISOString()

    });


    savePosts();

    renderComments();

}


/* =========================
   EDIT COMMENT
========================= */

function editComment(id) {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if(!post) return;


    const comment =
        post.comments.find(
            c => c.id === id
        );


    if(!comment) return;


    const newText =
        prompt(
            "댓글 수정",
            comment.text
        );


    if(
        newText === null ||
        !newText.trim()
    )
        return;


    comment.text =
        newText.trim();


    savePosts();

    renderComments();

}


/* =========================
   DELETE COMMENT
========================= */

function deleteComment(id) {

    const post =
        posts.find(
            p => p.id === currentPostId
        );


    if(!post) return;


    if(
        !confirm(
            "이 댓글을 삭제하시겠습니까?"
        )
    )
        return;


    post.comments =
        post.comments.filter(
            c => c.id !== id
        );


    savePosts();

    renderComments();

    renderPosts();

}

========================= */

    document.getElementById(
        "totalPosts"
    ).textContent =
        posts.length;


    const comments =
        posts.reduce(
            (total,post) =>
                total +
                post.comments.length,
            0
        );


    const likes =
        posts.reduce(
            (total,post) =>
                total +
                post.likes,
            0
        );


    document.getElementById(
        "totalComments"
    ).textContent =
        comments;


    document.getElementById(
        "totalLikes"
    ).textContent =
        likes;

}

   INIT
